<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Event Registration Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:30px;
}

.container{
    width:800px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0px 10px 25px rgba(0,0,0,.4);
}

h1{
    text-align:center;
    color:#003366;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:gray;
    margin-bottom:30px;
}

form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.full{
    grid-column:1/3;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#333;
}

input,select,textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border:2px solid #0066cc;
}

.gender{
    display:flex;
    gap:20px;
    margin-top:8px;
}

.gender label{
    font-weight:normal;
}

.activities{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.activities label{
    font-weight:normal;
}

textarea{
    resize:none;
}

.buttons{
    grid-column:1/3;
    text-align:center;
}

button{
    padding:12px 35px;
    font-size:17px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin:10px;
    transition:.3s;
}

.submit{
    background:#0066cc;
    color:white;
}

.submit:hover{
    background:#004999;
}

.reset{
    background:#999;
    color:white;
}

.reset:hover{
    background:#666;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:gray;
}

@media(max-width:700px){

form{
grid-template-columns:1fr;
}

.full,.buttons{
grid-column:1;
}

.activities{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="container">

<h1>COLLEGE EVENT REGISTRATION</h1>

<p class="subtitle">
Register for your favourite extracurricular activities
</p>

<form>

<div>
<label>Full Name</label>
<input type="text" placeholder="Enter your full name" required>
</div>

<div>
<label>Age</label>
<input type="number" min="15" max="30" placeholder="Enter your age" required>
</div>

<div>
<label>Email</label>
<input type="email" placeholder="Enter your email" required>
</div>

<div>
<label>Phone Number</label>
<input type="tel" maxlength="10" placeholder="Enter phone number" required>
</div>

<div>
<label>Gender</label>

<div class="gender">

<label><input type="radio" name="gender" required> Male</label>

<label><input type="radio" name="gender"> Female</label>

<label><input type="radio" name="gender"> Other</label>

</div>

</div>

<div>
<label>Date of Birth</label>
<input type="date" required>
</div>

<div>
<label>Department</label>

<select required>

<option value="">Select Department</option>

<option>Computer Science Engineering</option>

<option>Information Technology</option>

<option>Electronics & Communication</option>

<option>Electrical Engineering</option>

<option>Mechanical Engineering</option>

<option>Civil Engineering</option>

<option>MBA</option>

</select>

</div>

<div>
<label>Year</label>

<select required>

<option value="">Select Year</option>

<option>1st Year</option>

<option>2nd Year</option>

<option>3rd Year</option>

<option>4th Year</option>

</select>

</div>

<div>
<label>Section</label>

<select required>

<option value="">Select Section</option>

<option>A</option>

<option>B</option>

<option>C</option>

<option>D</option>

</select>

</div>

<div class="full">

<label>Area of Registration</label>

<div class="activities">

<label><input type="checkbox"> Dancing</label>

<label><input type="checkbox"> Singing</label>

<label><input type="checkbox"> Gaming</label>

<label><input type="checkbox"> Essay Writing</label>

<label><input type="checkbox"> Painting</label>

<label><input type="checkbox"> Photography</label>

<label><input type="checkbox"> Quiz</label>

<label><input type="checkbox"> Coding</label>

</div>

</div>

<div class="full">

<label>Address</label>

<textarea rows="4" placeholder="Enter your address"></textarea>

</div>

<div class="buttons">

<button class="submit" type="submit">
Register
</button>

<button class="reset" type="reset">
Reset
</button>

</div>

</form>

<div class="footer">
© 2026 College Event Registration Portal
</div>

</div>

</body>
</html>
